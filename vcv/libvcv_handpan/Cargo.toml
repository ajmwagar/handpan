[package]
name = "vcv-handpan-lib"
version = "0.1.0"
edition = "2021"
authors = ["Avery Wagar"]
description = "Rust static library (cxx bridge) for the Puget Handpan VCV Rack module"
license-file = "../../LICENSE"
publish = false

# Stand-alone workspace root so this doesn't join the host workspace.
[workspace]

[lib]
name = "vcv_handpan"
crate-type = ["staticlib", "rlib"]

[profile.release]
lto = "thin"
panic = "abort"

[dependencies]
handpan-core = { path = "../../crates/handpan-core" }
cxx = "1.0"

[build-dependencies]
cxx-build = "1.0"
