[package]
name = "handpan-core"
version = "0.1.0"
edition = "2021"
authors = ["Avery Wagar"]
description = "Modal physical-modeling synthesis core for polyphonic handpans"
license-file = "../../LICENSE"
publish = false

[features]
default = ["std"]
# Host builds (VSTi, tests, WAV rendering): use libstd math.
std = []
# Embedded / firmware builds: no_std + alloc, transcendentals via libm.
# Enable with `--no-default-features --features libm`.
libm = ["dep:libm"]

[dependencies]
# The only optional dependency, pulled in solely for no_std firmware builds to
# supply sin/cos/exp/pow. Host/plugin builds (default = std) stay dependency-free
# so the shippable voice IP carries no third-party code.
libm = { version = "0.2", optional = true }

[[example]]
name = "render_wav"
required-features = ["std"]
