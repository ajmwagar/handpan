[package]
name = "wind-core"
version = "0.1.0"
edition = "2021"
authors = ["Avery Wagar"]
description = "Wind physical modeling (clarinet/flute/saxophone/brass) — waveguide air column + nonlinear reed/jet/lip exciter"
license-file = "../../LICENSE"
publish = false

[features]
default = ["std"]
std = ["puget-dsp/std"]
libm = ["dep:libm", "puget-dsp/libm"]

[dependencies]
libm = { version = "0.2", optional = true }
puget-dsp = { path = "../puget-dsp", default-features = false }

[[example]]
name = "render_winds"
required-features = ["std"]

[[example]]
name = "probe"
required-features = ["std"]

[[example]]
name = "render_ensemble"
required-features = ["std"]

[[example]]
name = "render_didge"
required-features = ["std"]
